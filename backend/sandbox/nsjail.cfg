# nsjail configuration for one compile or run step of contest code.
#
# Per-step settings (time, memory, process limits, the two bind mounts for the
# run directory, the working directory and the command) are passed on the
# command line by backend/src/sandbox/nsjailExecutor.ts and override this file.
#
# NOT YET VERIFIED against a real nsjail: see docs/sandbox.md.

name: "icpc-live"
description: "Untrusted contest code: no network, no host files, read-only toolchain."

mode: ONCE
hostname: "sandbox"
log_level: WARNING

# Safe defaults in case a per-step flag is ever missing.
time_limit: 30
rlimit_cpu: 20
rlimit_fsize: 16
rlimit_nofile: 256
rlimit_core: 0
max_cpus: 1

# Nothing from the server's environment (secrets, tokens) is passed in.
keep_env: false
envar: "PATH=/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"

# New namespaces for everything. The network namespace is empty and even the
# loopback interface stays down.
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
iface_no_lo: true

# The program runs as an ordinary user that maps to the server's own
# unprivileged user outside the jail.
uidmap {
	inside_id: "1000"
	outside_id: ""
	count: 1
}

gidmap {
	inside_id: "1000"
	outside_id: ""
	count: 1
}

# No chroot is set, so the jail's root is an empty tmpfs and only the paths
# below exist inside it. /app and the rooms data directory are never mounted.

mount {
	src: "/usr"
	dst: "/usr"
	is_bind: true
	rw: false
}

mount {
	src: "usr/bin"
	dst: "/bin"
	is_symlink: true
}

mount {
	src: "usr/lib"
	dst: "/lib"
	is_symlink: true
}

mount {
	src: "usr/lib64"
	dst: "/lib64"
	is_symlink: true
	mandatory: false
}

mount {
	src: "/etc/alternatives"
	dst: "/etc/alternatives"
	is_bind: true
	rw: false
}

mount {
	src: "/etc/java-17-openjdk"
	dst: "/etc/java-17-openjdk"
	is_bind: true
	rw: false
	mandatory: false
}

mount {
	src: "/etc/ld.so.cache"
	dst: "/etc/ld.so.cache"
	is_bind: true
	rw: false
	mandatory: false
}

mount {
	src: "/opt/kotlinc"
	dst: "/opt/kotlinc"
	is_bind: true
	rw: false
	mandatory: false
}

mount {
	src_content: "sandbox:x:1000:1000:sandbox:/tmp:/bin/false\n"
	dst: "/etc/passwd"
}

mount {
	src: "/dev/null"
	dst: "/dev/null"
	is_bind: true
	rw: true
}

mount {
	src: "/dev/zero"
	dst: "/dev/zero"
	is_bind: true
	rw: true
}

mount {
	src: "/dev/urandom"
	dst: "/dev/urandom"
	is_bind: true
	rw: false
}

mount {
	dst: "/proc"
	fstype: "proc"
	rw: false
}

mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
	options: "size=67108864"
	nosuid: true
	nodev: true
}
